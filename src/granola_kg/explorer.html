<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Granola Graph Explorer</title>
  <style>
    :root { color-scheme: dark; --ink:#f4f0e8; --muted:#9ba7a0; --panel:#17201d; --line:#30403a; --accent:#ddff7c; }
    * { box-sizing:border-box }
    body { margin:0; background:#0d1311; color:var(--ink); font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace; overflow:hidden }
    header { height:68px; display:flex; align-items:center; gap:22px; padding:0 24px; border-bottom:1px solid var(--line); background:#101815 }
    .brand { display:flex; align-items:center; gap:11px; white-space:nowrap }
    .mark { width:27px; height:27px; border:1px solid var(--accent); border-radius:50%; position:relative }
    .mark:after { content:""; position:absolute; inset:7px; background:var(--accent); border-radius:50% }
    h1 { font:600 14px/1 ui-monospace,monospace; letter-spacing:.08em; text-transform:uppercase; margin:0 }
    .search { flex:1; max-width:540px; position:relative }
    input { width:100%; background:#0b100e; border:1px solid var(--line); border-radius:5px; padding:10px 13px; color:var(--ink); font:inherit; outline:none }
    input:focus { border-color:var(--accent) }
    .stats { margin-left:auto; color:var(--muted); white-space:nowrap }
    main { height:calc(100vh - 68px); display:grid; grid-template-columns:minmax(0,1fr) 340px }
    .canvas { position:relative; min-width:0; background:radial-gradient(circle at center,#17211d 0,#0d1311 62%) }
    svg { width:100%; height:100%; display:block }
    .edge { stroke:#54635d; stroke-width:1; opacity:.42 }
    .edge.active { stroke:var(--accent); stroke-width:2; opacity:.9 }
    .node { cursor:pointer; transition:opacity .15s }
    .node circle { stroke:#0d1311; stroke-width:2 }
    .node:hover circle,.node.active circle { stroke:var(--accent); stroke-width:4 }
    .node text { fill:#dce4df; font-size:11px; paint-order:stroke; stroke:#0d1311; stroke-width:4px; stroke-linejoin:round }
    .dim { opacity:.1 }
    .empty { position:absolute; inset:0; display:grid; place-content:center; color:var(--muted); text-align:center }
    aside { border-left:1px solid var(--line); background:var(--panel); padding:25px; overflow:auto }
    .eyebrow { color:var(--accent); text-transform:uppercase; letter-spacing:.12em; font-size:11px }
    h2 { font:500 25px/1.2 ui-sans-serif,system-ui,sans-serif; margin:10px 0 5px }
    .type { color:var(--muted) }
    section { border-top:1px solid var(--line); margin-top:25px; padding-top:18px }
    h3 { margin:0 0 13px; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.1em }
    .property { margin-bottom:18px }
    .field { color:var(--accent); font-size:12px }
    .value { margin:3px 0 7px; overflow-wrap:anywhere }
    blockquote { margin:0; padding:9px 11px; border-left:2px solid #52635c; background:#111916; color:#b8c2bc; font:12px/1.5 ui-sans-serif,system-ui,sans-serif }
    .relation { padding:8px 0; border-bottom:1px solid #26332e; color:#bdc8c1 }
    .legend { position:absolute; left:18px; bottom:16px; display:flex; flex-wrap:wrap; gap:7px 13px; max-width:70%; padding:9px 12px; background:#101815dc; border:1px solid var(--line); border-radius:5px; font-size:11px }
    .legend span { display:flex; align-items:center; gap:6px }
    .dot { width:8px; height:8px; border-radius:50% }
    @media (max-width:800px) { main{grid-template-columns:1fr} aside{position:absolute;right:0;top:68px;bottom:0;width:min(88vw,340px);box-shadow:-10px 0 30px #0008}.stats{display:none} }
  </style>
</head>
<body>
  <header>
    <div class="brand"><div class="mark"></div><h1>Granola Graph</h1></div>
    <div class="search"><input id="search" type="search" placeholder="Filter entities by name or type…" aria-label="Filter entities"></div>
    <div class="stats" id="stats">Loading local graph…</div>
  </header>
  <main>
    <div class="canvas">
      <svg id="graph" viewBox="0 0 1000 700" role="img" aria-label="Knowledge graph"></svg>
      <div class="empty" id="empty" hidden>No entities yet.<br>Run <code>granola-kg sync</code> to build your graph.</div>
      <div class="legend" id="legend"></div>
    </div>
    <aside>
      <div class="eyebrow">Local knowledge</div>
      <h2 id="name">Select an entity</h2>
      <div class="type" id="type">Click a node to inspect its evidence.</div>
      <section><h3>Relationships</h3><div id="relations">—</div></section>
      <section><h3>Evidence-backed properties</h3><div id="properties">—</div></section>
    </aside>
  </main>
  <script>
    const svg = document.querySelector('#graph');
    const ns = 'http://www.w3.org/2000/svg';
    const palette = ['#ddff7c','#76d7c4','#f4a261','#a8b8ff','#e994c5','#83c5ff','#f2d06b','#b9e48c'];
    let graph = {nodes:[],edges:[]};
    let selected = null;
    const colorFor = type => {
      let hash = 0;
      for (const char of type) hash = ((hash << 5) - hash + char.charCodeAt(0)) | 0;
      return palette[Math.abs(hash) % palette.length];
    };
    const element = (name, attrs={}) => {
      const node = document.createElementNS(ns,name);
      for (const [key,value] of Object.entries(attrs)) node.setAttribute(key,String(value));
      return node;
    };
    function render() {
      svg.replaceChildren();
      const positions = new Map();
      const total = Math.max(graph.nodes.length,1);
      graph.nodes.forEach((node,index) => {
        const angle = index * 2.399963;
        const radius = 55 + 265 * Math.sqrt((index + 1) / total);
        positions.set(node.id,{x:500 + Math.cos(angle)*radius,y:350 + Math.sin(angle)*radius});
      });
      graph.edges.forEach(edge => {
        const a=positions.get(edge.source), b=positions.get(edge.target);
        if (!a || !b) return;
        svg.append(element('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,class:'edge','data-source':edge.source,'data-target':edge.target}));
      });
      graph.nodes.forEach(node => {
        const p=positions.get(node.id), group=element('g',{class:'node',tabindex:'0','data-id':node.id});
        group.append(element('circle',{cx:p.x,cy:p.y,r:node.type==='meeting'?12:8,fill:colorFor(node.type)}));
        const label=element('text',{x:p.x+13,y:p.y+4});
        label.textContent=node.name.length>28?node.name.slice(0,26)+'…':node.name;
        group.append(label);
        group.addEventListener('click',()=>selectNode(node));
        group.addEventListener('keydown',event=>{if(event.key==='Enter')selectNode(node)});
        svg.append(group);
      });
      renderLegend();
      filterGraph(document.querySelector('#search').value);
    }
    function renderLegend() {
      const legend=document.querySelector('#legend'); legend.replaceChildren();
      [...new Set(graph.nodes.map(node=>node.type))].sort().forEach(type=>{
        const item=document.createElement('span'),dot=document.createElement('i');
        dot.className='dot'; dot.style.background=colorFor(type); item.append(dot,document.createTextNode(type)); legend.append(item);
      });
    }
    function filterGraph(value) {
      const term=value.trim().toLowerCase(), visible=new Set();
      document.querySelectorAll('.node').forEach(item=>{
        const node=graph.nodes.find(candidate=>candidate.id===item.dataset.id);
        const match=!term || `${node.name} ${node.type}`.toLowerCase().includes(term);
        item.classList.toggle('dim',!match); if(match)visible.add(node.id);
      });
      document.querySelectorAll('.edge').forEach(item=>item.classList.toggle('dim',term && (!visible.has(item.dataset.source)||!visible.has(item.dataset.target))));
    }
    async function selectNode(node) {
      selected=node.id;
      document.querySelectorAll('.node').forEach(item=>item.classList.toggle('active',item.dataset.id===node.id));
      document.querySelectorAll('.edge').forEach(item=>item.classList.toggle('active',item.dataset.source===node.id||item.dataset.target===node.id));
      document.querySelector('#name').textContent=node.name;
      document.querySelector('#type').textContent=node.type;
      const relations=document.querySelector('#relations'); relations.replaceChildren();
      graph.edges.filter(edge=>edge.source===node.id||edge.target===node.id).forEach(edge=>{
        const other=graph.nodes.find(item=>item.id===(edge.source===node.id?edge.target:edge.source));
        const row=document.createElement('div'); row.className='relation'; row.textContent=`${edge.type} → ${other?.name||'Unknown'}`; relations.append(row);
      });
      if(!relations.children.length) relations.textContent='No relationships';
      const response=await fetch(`/api/entity?id=${encodeURIComponent(node.id)}`), detail=await response.json();
      if(selected!==node.id)return;
      const properties=document.querySelector('#properties'); properties.replaceChildren();
      detail.properties.forEach(item=>{
        const box=document.createElement('div'); box.className='property';
        const field=document.createElement('div'); field.className='field'; field.textContent=item.field;
        const value=document.createElement('div'); value.className='value'; value.textContent=item.value;
        const quote=document.createElement('blockquote'); quote.textContent=item.evidence.excerpt;
        box.append(field,value,quote); properties.append(box);
      });
      if(!properties.children.length) properties.textContent='No properties';
    }
    document.querySelector('#search').addEventListener('input',event=>filterGraph(event.target.value));
    fetch('/api/graph').then(response=>response.json()).then(data=>{
      graph=data; render();
      document.querySelector('#stats').textContent=`${data.nodes.length} entities · ${data.edges.length} relations${data.truncated?' · latest 300':''}`;
      document.querySelector('#empty').hidden=data.nodes.length>0;
    }).catch(()=>{document.querySelector('#stats').textContent='Unable to load graph'});
  </script>
</body>
</html>
